<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f4" />
    <script>
      (() => {
        const saved = localStorage.getItem("scope-ui-theme");
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const savedStyle = localStorage.getItem("scope-ui-style");
        const style = savedStyle === "editorial" ? "editorial" : "scope";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.style = style;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta
      name="description"
      content="A safe, scoped editor for responsive website templates."
    />
    <meta property="og:title" content="Scope — AI Template Editor" />
    <meta
      property="og:description"
      content="Edit, review, and recover responsive template changes with confidence."
    />
    <title>Scope — AI Template Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lora:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
